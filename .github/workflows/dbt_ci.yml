name: AtmoSync dbt CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dbt_validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake sqlfluff

      - name: Check dbt Syntax & Dependencies
        run: |
          cd atmosync_dbt
          dbt deps

      - name: Lint SQL Models (Dry-Run)
        run: |
          sqlfluff lint atmosync_dbt/models --dialect snowflake || true
